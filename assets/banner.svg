<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3987e5" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="#14140f"/>
  <circle cx="990" cy="160" r="235" fill="url(#glow)"/>

  <!-- Wordmark and tagline -->
  <text x="88" y="168" font-size="104" font-weight="700" letter-spacing="-3" fill="#ffffff">pyokf</text>
  <text x="94" y="222" font-size="23" fill="#c3c2b7">Store, query, and generate knowledge in the Open Knowledge Format</text>
  <text x="94" y="260" font-size="16" letter-spacing="1.4" fill="#8a897f">GWENLAKE · APACHE-2.0 · PYTHON 3.10+</text>

  <!-- A miniature of what the library draws: a folder holding concepts, with one
       markdown link between two of them. Edges are trimmed at both ends so they
       neither run through the hollow folder ring nor cross another node. -->
  <g transform="translate(-30 0)" stroke-linecap="round">
    <g stroke="#8a897f" stroke-width="1.6" opacity=".6" stroke-dasharray="2 5">
      <line x1="992" y1="144" x2="1070" y2="101"/>
      <line x1="996" y1="162" x2="1116" y2="169"/>
      <line x1="990" y1="179" x2="1074" y2="236"/>
      <line x1="995" y1="154" x2="1167" y2="122"/>
    </g>
    <line x1="1086" y1="92" x2="1132" y2="170" stroke="#c3c2b7" stroke-width="2.4" opacity=".9"/>

    <g stroke="#14140f" stroke-width="3">
      <circle cx="962" cy="160" r="27" fill="none" stroke="#3987e5" stroke-width="5"/>
      <circle cx="1086" cy="92" r="14" fill="#3987e5"/>
      <circle cx="1132" cy="170" r="12" fill="#d95926"/>
      <circle cx="1086" cy="244" r="11" fill="#199e70"/>
      <circle cx="1178" cy="120" r="7" fill="#8a897f"/>
    </g>
  </g>
</svg>
